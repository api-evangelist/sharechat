name: Sharechat
description: >-
  ShareChat (Mohalla Tech Pvt. Ltd.) is an Indian social media company that
  operates the regional-language social network ShareChat and the short-video
  entertainment app Moj. The platform lets users across 15+ Indian languages
  share posts, images, videos, shayari, quotes, and trending content through
  personalized feeds. ShareChat monetizes through a self-serve advertising
  platform (ShareChat Ads) offering campaign management, audience targeting, and
  brand partnerships across its social and short-video surfaces. Backed by
  Lightspeed Venture Partners and other investors, the company is one of the
  largest homegrown social platforms in India. As of this profile, ShareChat
  exposes consumer apps and a self-serve ad manager but publishes no public
  developer program, API documentation, or programmatic API surface.
